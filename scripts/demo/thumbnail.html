<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sulit thumbnail</title>
<style>
  @font-face { font-family: 'Plex Sans'; font-weight: 500; src: url('../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plex Sans'; font-weight: 600; src: url('../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plex Mono'; font-weight: 500; src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }
  :root { --bg: #f4f2ec; --surface: #fffdf8; --ink: #1d1f1c; --muted: #5f625a; --line: #dcd8cc;
    --device: #0f5132; --device-soft: #e3efe7; --cloud: #8a4b08; --cloud-soft: #f8ecdc; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); font-family: 'Plex Sans', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .wrap { position: absolute; inset: 0; display: grid; grid-template-columns: 560px 1fr; gap: 40px; padding: 64px 64px 56px 72px; align-items: center; }
  .brand { display: flex; align-items: center; gap: 18px; color: var(--device); }
  .brand svg { width: 64px; height: 64px; }
  .brand b { font: 600 64px/1 'Plex Sans'; letter-spacing: -.035em; color: var(--ink); }
  h1 { margin-top: 30px; font: 600 66px/1.04 'Plex Sans'; letter-spacing: -.03em; }
  h1 .d { color: var(--device); }
  .stat { margin-top: 30px; display: inline-flex; align-items: baseline; gap: 14px; background: var(--device); color: var(--surface); border-radius: 16px; padding: 14px 24px 16px; }
  .stat b { font: 600 46px/1 'Plex Sans'; letter-spacing: -.02em; }
  .stat span { font: 500 24px/1.2 'Plex Sans'; opacity: .92; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 2px 4px rgba(29,31,28,.05), 0 30px 60px -30px rgba(29,31,28,.35); overflow: hidden; }
  .zone { padding: 14px 24px; font: 600 20px 'Plex Sans'; display: flex; align-items: center; gap: 10px; }
  .zone.d { background: var(--device-soft); color: var(--device); }
  .zone.o { background: var(--cloud-soft); color: var(--cloud); border-top: 2px dashed #c79157; }
  .msg { padding: 20px 24px 22px; font: 500 25px/1.62 'Plex Sans'; }
  .msg s { text-decoration: none; background: linear-gradient(transparent 52%, rgba(161,42,31,.28) 52%, rgba(161,42,31,.28) 82%, transparent 82%); }
  .tok { font: 500 21px 'Plex Mono'; padding: 2px 8px; border-radius: 7px; white-space: nowrap; }
  .p { background: #e6ecfb; color: #2a4ab0; }
  .i { background: #fde8e5; color: #a12a1f; }
  .ph { background: #e3efe7; color: #0f5132; }
  .a { background: #f1e6fa; color: #6b2a9c; }
  .chip { display: inline-flex; gap: 8px; align-items: center; margin-top: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="6" width="26" height="20" rx="5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16 6v20" stroke="currentColor" stroke-width="2.4" stroke-dasharray="3 3"/><circle cx="10" cy="16" r="2.8" fill="currentColor"/></svg><b>Sulit</b></div>
      <h1>Patient details <span class="d">stay at the counter.</span></h1>
      <div class="stat"><b>0</b><span>personal details sent<br />to the cloud</span></div>
    </div>
    <div class="card">
      <div class="zone d">● On this PC · Gemini Nano</div>
      <div class="msg">Salam, saya <s>Aisyah binti Rahman</s> (IC <s>900101-14-5678</s>). WhatsApp <s>+60 12-345 6789</s>…</div>
      <div class="zone o">↑ Leaves this PC</div>
      <div class="msg">Salam, saya <span class="tok p">[PERSON_1]</span> (IC <span class="tok i">[ID_NUMBER_1]</span>). WhatsApp <span class="tok ph">[PHONE_1]</span>…</div>
    </div>
  </div>
</body>
</html>
